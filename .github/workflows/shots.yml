name: Changed screens

on:
  workflow_dispatch:
    inputs:
      tests:
        description: UI tests to run (space separated)
        default: testChangedScreens

jobs:
  preview:
    # Xcode 27 image (iOS 27 SDK + simulator). Change to macos-26 to build with Xcode 26 / iOS 26.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Liquid Glass icon renders (Apple ictool)
        if: inputs.tests == 'icon'
        run: |
          ICTOOL="$(dirname "$(xcode-select -p)")/Applications/Icon Composer.app/Contents/Executables/ictool"
          ls -la "$ICTOOL" || find /Applications -name ictool -maxdepth 8 2>/dev/null | head
          "$ICTOOL" --version || true
          mkdir -p shots
          for I in Design/AppIcon*.icon; do N=$(basename "$I" .icon)
          for R in $RS; do
            "$ICTOOL" "$I" --export-image --output-file "shots/$N-$R.png" --platform iOS --rendition "$R" --width 512 --height 512 --scale 2 || echo "fail $N $R"
          done; done
          ls -la shots

      - name: Tools
        if: inputs.tests != 'icon'
        run: |
          brew install xcodegen
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Apple Siri artwork for preview (downloaded at build time, never committed)
        if: inputs.tests != 'icon'
        run: |
          curl -sL -o /tmp/siri.dmg https://devimages-cdn.apple.com/design/resources/download/Icon-Siri.dmg
          yes | hdiutil attach -nobrowse -readonly -mountpoint /tmp/sirimnt /tmp/siri.dmg
          mkdir -p Dayline/Resources
          cp "/tmp/sirimnt/Siri Icons/Siri - Orb.png" Dayline/Resources/SiriOrb.png
          hdiutil detach /tmp/sirimnt || true

      - name: Generate project
        if: inputs.tests != 'icon'
        run: xcodegen generate

      - name: Pick simulator
        if: inputs.tests != 'icon'
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=[k for k in d if "iOS" in k]
          ios.sort()
          for rt in reversed(ios):
              for dev in d[rt]:
                  if "iPhone" in dev["name"] and "Pro" in dev["name"] and "Max" not in dev["name"]:
                      print(dev["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3

      - name: Build
        if: inputs.tests != 'icon'
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Dayline.xcodeproj -scheme Dayline \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -quiet CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log || (grep -E "error:" build.log | sort -u | head -80; exit 1)

      - name: Screenshots
        if: inputs.tests != 'icon'
        timeout-minutes: 45
        run: |
          mkdir -p shots /tmp/dayline-shots
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance light
          for TEST in ${{ inputs.tests || 'testChangedScreens' }}; do
            xcodebuild test-without-building \
              -project Dayline.xcodeproj -scheme Dayline \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath build -only-testing:DaylineUITests/DemoTourTests/$TEST \
              -collect-test-diagnostics never 2>&1 | tail -30 || true
            cp /tmp/dayline-shots/*.png shots/ 2>/dev/null || true
          done
          cp /tmp/dayline-shots/*.png shots/ || true
          ls shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changed-screens
          path: shots
