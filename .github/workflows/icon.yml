name: icon
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Render Liquid Glass icon with Apple's ictool
        run: |
          set -x
          ls /Applications | grep -i xcode || true
          for X in /Applications/Xcode_26*.app /Applications/Xcode.app; do [ -d "$X" ] && sudo xcode-select -s "$X" && break; done
          xcodebuild -version
          ICTOOL="$(dirname "$(xcode-select -p)")/Applications/Icon Composer.app/Contents/Executables/ictool"
          ls -la "$ICTOOL" || find /Applications -name ictool -maxdepth 8 2>/dev/null | head
          "$ICTOOL" --version || true
          mkdir -p out
          for R in Default Dark ClearLight ClearDark TintedLight TintedDark; do
            "$ICTOOL" Design/AppIcon.icon --export-image --output-file "out/icon-$R.png" --platform iOS --rendition "$R" --width 512 --height 512 --scale 2 || echo "fail $R"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-renders
          path: out
